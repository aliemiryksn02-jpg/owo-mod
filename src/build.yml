name: Build
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "Windows"
          os: windows-latest
        - name: "macOS"
          os: macos-latest
        - name: "Android32"
          os: ubuntu-latest
        - name: "Android64"
          os: ubuntu-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Geode CLI
        uses: geode-sdk/setup-cli@main
        with:
          cache: true

      - name: Build the mod
        run: geode build --no-install
