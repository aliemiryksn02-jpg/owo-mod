name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            target: win64
            os: ubuntu-latest

          - name: macOS
            target: macos
            os: macos-latest

          - name: Android64
            target: android64
            os: ubuntu-latest

          - name: Android32
            target: android32
            os: ubuntu-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}
          combine: true
